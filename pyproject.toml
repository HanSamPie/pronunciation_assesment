[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pronunciation_assessment"
version = "0.1.0"
description = "Automated Pronunciation Assessment"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "hydra-core>=1.3.0",
    "mlflow>=2.0.0",
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.2.0",
    "xgboost>=1.7.0",
    "h5py>=3.8.0",
    "opensmile>=2.4.2",
    "soundfile>=0.12.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "joblib>=1.2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=src"
testpaths = ["tests"]
