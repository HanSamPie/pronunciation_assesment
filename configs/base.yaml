# Reproducibility
seed: 42

# MLflow
mlflow_tracking_uri: http://127.0.0.1:5000
experiment_name: apa_default

# Data paths
data_dir: data/raw
splits_dir: data/splits
features_dir: data/features
scalers_dir: data/scalers
scores_file: data/raw/resource/scores.json

# Forced alignment
mfa_model: english_mfa

# Feature extraction
feature_store: hdf5          # Storage format (HDF5)
use_boundary_jitter: false   # Set true to enable ±5ms boundary jitter

# Phoneme boundary source
# "dataset"  — use the pre-computed TextGrid alignments shipped with the dataset
#              (default; no MFA installation required)
# "mfa"      — use MFA-generated TextGrids (requires MFA on PATH)
alignment_source: dataset

# Root directory of the TextGrid files (relative or absolute).
# Defaults to <data_dir>/../textgrids when left empty.
textgrid_dir: ""

# Loss weights (easily editable)
loss_weights:
  phoneme: 3.0
  word:    2.0
  sentence: 1.0

# Score modeling strategy
# Toggle between "major_scores" (Accuracy only) and "all_metrics" (all scoring axes)
score_mode: all_metrics

# Metric definitions per score_mode.
# Each entry maps a canonical metric key to its maximum score value.
# These are referenced by the model and loss to build the right set of heads.
metrics:
  major_scores:
    phoneme_accuracy: 2.0
    word_accuracy: 10.0
    sentence_accuracy: 10.0
  all_metrics:
    phoneme_accuracy: 2.0
    word_accuracy: 10.0
    word_stress: 10.0
    sentence_accuracy: 10.0
    sentence_fluency: 10.0
    sentence_prosodic: 10.0
